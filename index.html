<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>SUPER INTELLIGENT — AGI Bottleneck Interactive Preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #010308;
      color: #eaffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      overflow-y: auto;
      padding: clamp(8px, 2vh, 20px) 12px;
    }
    #player-shell {
      width: min(100%, 1600px, calc((100dvh - 172px) * 16 / 9));
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: auto;
    }
    #stage-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #02050c;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.75);
      overflow: hidden;
    }
    #canvas-container {
      position: absolute;
      inset: 0;
      z-index: 1;
    }
    #canvas-container canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
    #ui-hud {
      position: static;
      z-index: 2;
      width: 100%;
      max-width: none;
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding: 10px 14px 11px;
      background: rgba(8, 14, 28, 0.96);
      border: 1px solid rgba(90, 232, 255, 0.28);
      border-radius: 10px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.55), 0 0 16px rgba(90, 232, 255, 0.08);
    }
    .hud-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-width: 0;
    }
    .hud-btn {
      flex: 0 0 auto;
      min-height: 34px;
      padding: 6px 13px;
      background: rgba(90, 232, 255, 0.12);
      border: 1px solid rgba(90, 232, 255, 0.4);
      border-radius: 6px;
      color: #eaffff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .hud-btn:hover {
      background: rgba(90, 232, 255, 0.25);
      border-color: #5ae8ff;
      box-shadow: 0 0 10px rgba(90, 232, 255, 0.25);
    }
    .hud-btn:focus-visible, .nav-pill:focus-visible, #timeline-slider:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 2px;
    }
    #time-display {
      flex: 0 0 auto;
      min-width: 100px;
      color: #5ae8ff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }
    #timeline-slider {
      flex: 1 1 auto;
      min-width: 50px;
      height: 6px;
      accent-color: #5ae8ff;
      cursor: pointer;
    }
    #speed-btn { min-width: 60px; }
    #hud-toggle-btn {
      min-width: 106px;
      color: #bdeeff;
      background: rgba(255, 255, 255, 0.045);
      border-color: rgba(255, 255, 255, 0.2);
    }
    #secondary-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #ui-hud.chapters-collapsed #secondary-controls { display: none; }
    #audio-status {
      min-height: 14px;
      color: #b0cddb;
      font-size: 11px;
      line-height: 1.3;
    }
    #audio-track { display: none; }
    #v5-link { margin: 0; text-align: right; font-size: 12px; }
    #v5-link a { color: #73eaff; text-decoration: none; }
    #v5-link a:hover { text-decoration: underline; }
    .nav-pills {
      display: flex;
      justify-content: flex-start;
      gap: 6px;
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 2px 1px 4px;
      scrollbar-color: rgba(90, 232, 255, 0.35) transparent;
      scrollbar-width: thin;
    }
    .nav-pill {
      flex: 0 0 auto;
      padding: 5px 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      color: #b0cddb;
      font-size: 11px;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }
    .nav-pill:hover, .nav-pill.active {
      border-color: #5ae8ff;
      background: rgba(90, 232, 255, 0.17);
      color: #ffffff;
    }
    @media (max-width: 680px) {
      body { padding: 8px; }
      #player-shell { width: min(100%, calc((100dvh - 164px) * 16 / 9)); gap: 8px; }
      #ui-hud { padding: 9px 9px 8px; gap: 7px; }
      .hud-row { gap: 6px; }
      .hud-btn { min-height: 32px; padding: 5px 9px; font-size: 12px; }
      #time-display { min-width: 80px; font-size: 11px; }
      #speed-btn { min-width: 50px; }
      #hud-toggle-btn { min-width: 84px; }
      .nav-pill { padding: 5px 9px; }
    }
    @media (max-width: 380px) {
      #time-display { min-width: 72px; font-size: 10px; }
      .hud-row { gap: 4px; }
      .hud-btn { padding-inline: 7px; }
      #hud-toggle-btn { min-width: 76px; }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.186.1/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.186.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <main id="player-shell">
    <div id="stage-wrapper" aria-label="16:9 animation preview">
      <div id="canvas-container"></div>
    </div>
    <section id="ui-hud" aria-label="Video player controls">
      <div class="hud-row" id="transport-row">
        <button id="play-btn" class="hud-btn" type="button" aria-label="Play">Play</button>
        <span id="time-display" aria-live="off">00:00 / 03:30</span>
        <input type="range" id="timeline-slider" min="0" max="210" step="0.05" value="0" aria-label="Playback position" />
        <button id="speed-btn" class="hud-btn" type="button" aria-label="Playback speed">1.0x</button>
        <button id="hud-toggle-btn" class="hud-btn" type="button" aria-expanded="true" aria-controls="secondary-controls">Hide chapters</button>
      </div>
      <div id="secondary-controls">
        <div id="audio-status" role="status">Audio is ready · press Play to start synced preview</div>
        <nav class="nav-pills" aria-label="Video sections">
          <button class="nav-pill" type="button" data-time="0">0:00 Opening</button>
          <button class="nav-pill" type="button" data-time="22">0:22 Decision Tree</button>
          <button class="nav-pill" type="button" data-time="55">0:55 Pattern vs Cause</button>
          <button class="nav-pill" type="button" data-time="85">1:25 Learning Loop</button>
          <button class="nav-pill" type="button" data-time="115">1:55 Compute Limits</button>
          <button class="nav-pill" type="button" data-time="145">2:25 Capabilities</button>
          <button class="nav-pill" type="button" data-time="180">3:00 Neural Sphere</button>
          <button class="nav-pill" type="button" data-time="198">3:18 Brand Logo</button>
        </nav>
      </div>
    </section>
    <p id="v5-link"><a href="./v5-preview.html">開啟 V5 開場預覽（00:00–00:22）</a></p>
    <audio id="audio-track" preload="metadata">
      <source src="./assets/audio/final_mix.mp3" type="audio/mpeg" />
    </audio>
  </main>

  <script type="module" src="./src/v4_particle_documentary.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const playBtn = document.getElementById('play-btn');
      const timeDisplay = document.getElementById('time-display');
      const slider = document.getElementById('timeline-slider');
      const speedBtn = document.getElementById('speed-btn');
      const hud = document.getElementById('ui-hud');
      const hudToggle = document.getElementById('hud-toggle-btn');
      const pills = document.querySelectorAll('.nav-pill');

      let isPlaying = false;
      const speeds = [0.5, 1.0, 1.5, 2.0];
      let speedIdx = 1;

      function fmtTime(sec) {
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }

      window.updateUIPlayback = function(time, duration) {
        if (document.activeElement !== slider) slider.value = time;
        timeDisplay.textContent = `${fmtTime(time)} / ${fmtTime(duration)}`;
        pills.forEach(p => {
          const t = parseFloat(p.dataset.time);
          if (time >= t && time < t + 28) p.classList.add('active');
          else p.classList.remove('active');
        });
      };

      window.updateUIPlaybackState = function(playing, message) {
        isPlaying = playing;
        playBtn.textContent = playing ? 'Pause' : 'Play';
        playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
        document.getElementById('audio-status').textContent = message;
      };

      playBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        playBtn.textContent = isPlaying ? 'Pause' : 'Play';
        if (window.__togglePlayback) window.__togglePlayback(isPlaying);
      });

      slider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        if (window.__seekToTime) window.__seekToTime(val);
      });
      slider.addEventListener('change', () => slider.blur());

      speedBtn.addEventListener('click', () => {
        speedIdx = (speedIdx + 1) % speeds.length;
        const speed = speeds[speedIdx];
        speedBtn.textContent = `${speed.toFixed(1)}x`;
        if (window.__setPlaybackSpeed) window.__setPlaybackSpeed(speed);
      });

      pills.forEach(pill => {
        pill.addEventListener('click', () => {
          const t = parseFloat(pill.dataset.time);
          slider.value = t;
          if (window.__seekToTime) window.__seekToTime(t);
        });
      });

      function toggleChapters() {
        const collapsed = hud.classList.toggle('chapters-collapsed');
        hudToggle.textContent = collapsed ? 'Show chapters' : 'Hide chapters';
        hudToggle.setAttribute('aria-expanded', String(!collapsed));
      }
      hudToggle.addEventListener('click', toggleChapters);

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && !['BUTTON', 'INPUT'].includes(document.activeElement?.tagName)) {
          e.preventDefault();
          playBtn.click();
        } else if (e.key === 'h' || e.key === 'H') {
          toggleChapters();
        }
      });
    });
  </script>
</body>
</html>
