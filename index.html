<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SUPER INTELLIGENT — AGI Bottleneck V5 Interactive Preview</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #02050c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #ui-hud {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(8, 14, 28, 0.85);
      border: 1px solid rgba(90, 232, 255, 0.35);
      backdrop-filter: blur(12px);
      border-radius: 12px;
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: calc(100% - 60px);
      max-width: 900px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 16px rgba(90, 232, 255, 0.15);
      transition: opacity 0.3s;
    }
    .hud-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }
    .hud-btn {
      background: rgba(90, 232, 255, 0.12);
      border: 1px solid rgba(90, 232, 255, 0.4);
      color: #eaffff;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .hud-btn:hover {
      background: rgba(90, 232, 255, 0.25);
      border-color: #5ae8ff;
      box-shadow: 0 0 10px rgba(90, 232, 255, 0.4);
    }
    .hud-btn:active {
      transform: scale(0.96);
    }
    #time-display {
      color: #5ae8ff;
      font-family: monospace;
      font-size: 14px;
      min-width: 95px;
      font-weight: bold;
    }
    #timeline-slider {
      flex: 1;
      accent-color: #5ae8ff;
      cursor: pointer;
      height: 6px;
      border-radius: 3px;
    }
    .nav-pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .nav-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #b0cddb;
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-pill:hover, .nav-pill.active {
      background: rgba(90, 232, 255, 0.2);
      border-color: #5ae8ff;
      color: #ffffff;
      box-shadow: 0 0 8px rgba(90, 232, 255, 0.3);
    }
    #hud-toggle-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 20;
      background: rgba(8, 14, 28, 0.7);
      border: 1px solid rgba(90, 232, 255, 0.3);
      color: #5ae8ff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.186.1/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.186.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-container"></div>
  <button id="hud-toggle-btn">Toggle Controls (H)</button>
  <div id="ui-hud">
    <div class="hud-row">
      <button id="play-btn" class="hud-btn">Pause</button>
      <span id="time-display">00:00 / 03:30</span>
      <input type="range" id="timeline-slider" min="0" max="210" step="0.05" value="0" />
      <button id="speed-btn" class="hud-btn">1.0x</button>
    </div>
    <div class="hud-row nav-pills">
      <span class="nav-pill" data-time="0">0:00 Opening</span>
      <span class="nav-pill" data-time="22">0:22 Decision Tree</span>
      <span class="nav-pill" data-time="55">0:55 Pattern vs Cause</span>
      <span class="nav-pill" data-time="85">1:25 Learning Loop</span>
      <span class="nav-pill" data-time="115">1:55 Compute Limits</span>
      <span class="nav-pill" data-time="145">2:25 Capabilities</span>
      <span class="nav-pill" data-time="180">3:00 Neural Sphere</span>
      <span class="nav-pill" data-time="198">3:18 Brand Logo</span>
    </div>
  </div>

  <script type="module" src="./src/v4_particle_documentary.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const playBtn = document.getElementById('play-btn');
      const timeDisplay = document.getElementById('time-display');
      const slider = document.getElementById('timeline-slider');
      const speedBtn = document.getElementById('speed-btn');
      const hud = document.getElementById('ui-hud');
      const hudToggle = document.getElementById('hud-toggle-btn');
      const pills = document.querySelectorAll('.nav-pill');

      let isPlaying = true;
      let playbackSpeed = 1.0;
      const speeds = [0.5, 1.0, 1.5, 2.0];
      let speedIdx = 1;

      function fmtTime(sec) {
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }

      window.updateUIPlayback = function(time, duration) {
        if (!document.activeElement || document.activeElement !== slider) {
          slider.value = time;
        }
        timeDisplay.textContent = `${fmtTime(time)} / ${fmtTime(duration)}`;
        pills.forEach(p => {
          const t = parseFloat(p.dataset.time);
          if (time >= t && time < t + 30) p.classList.add('active');
          else p.classList.remove('active');
        });
      };

      playBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        playBtn.textContent = isPlaying ? 'Pause' : 'Play';
        if (window.__togglePlayback) window.__togglePlayback(isPlaying);
      });

      slider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        if (window.__seekToTime) window.__seekToTime(val);
      });

      speedBtn.addEventListener('click', () => {
        speedIdx = (speedIdx + 1) % speeds.length;
        playbackSpeed = speeds[speedIdx];
        speedBtn.textContent = `${playbackSpeed}x`;
        if (window.__setPlaybackSpeed) window.__setPlaybackSpeed(playbackSpeed);
      });

      pills.forEach(pill => {
        pill.addEventListener('click', () => {
          const t = parseFloat(pill.dataset.time);
          slider.value = t;
          if (window.__seekToTime) window.__seekToTime(t);
        });
      });

      hudToggle.addEventListener('click', () => {
        hud.style.opacity = hud.style.opacity === '0' ? '1' : '0';
        hud.style.pointerEvents = hud.style.opacity === '0' ? 'none' : 'all';
      });

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          playBtn.click();
        } else if (e.key === 'h' || e.key === 'H') {
          hudToggle.click();
        }
      });
    });
  </script>
</body>
</html>
