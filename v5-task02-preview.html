<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <link rel="modulepreload" href="./assets/vendor/three.module.js" />
  <title>SUPER INTELLIGENT — V5 任務 2 預覽</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: #010308; color: #eaffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    body { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; overflow-x: hidden; overflow-y: auto; padding: clamp(8px, 2vh, 20px) 12px; }
    #player-shell { width: min(100%, 1600px, calc((100dvh - 215px) * 16 / 9)); display: flex; flex-direction: column; gap: 10px; margin: auto; }
    #stage-wrapper { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #02050b; overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,.75); }
    #canvas-container { position: absolute; inset: 0; }
    #canvas-container canvas { display: block; width: 100% !important; height: 100% !important; }
    #player-controls { display: flex; flex-direction: column; gap: 9px; width: 100%; padding: 10px 14px 11px; border: 1px solid rgba(90,232,255,.28); border-radius: 10px; background: rgba(8,14,28,.96); box-shadow: 0 8px 32px rgba(0,0,0,.55); }
    .control-row { display: flex; align-items: center; gap: 10px; width: 100%; min-width: 0; }
    .button { flex: 0 0 auto; min-height: 34px; padding: 6px 12px; border: 1px solid rgba(90,232,255,.4); border-radius: 6px; background: rgba(90,232,255,.12); color: #eaffff; font-size: 13px; font-weight: 650; cursor: pointer; }
    .button:hover, .chapter:hover, .chapter.active { background: rgba(90,232,255,.23); border-color: #5ae8ff; color: white; }
    .button:focus-visible, .chapter:focus-visible, #timeline:focus-visible, .text-link:focus-visible { outline: 2px solid white; outline-offset: 2px; }
    #time { flex: 0 0 auto; min-width: 104px; text-align: center; color: #5ae8ff; font: 700 13px ui-monospace, SFMono-Regular, Consolas, monospace; font-variant-numeric: tabular-nums; }
    #timeline { flex: 1 1 auto; min-width: 45px; height: 6px; accent-color: #5ae8ff; cursor: pointer; }
    #speed { min-width: 58px; }
    #chapter-toggle { min-width: 96px; color: #bdeeff; background: rgba(255,255,255,.045); border-color: rgba(255,255,255,.2); }
    #secondary { display: flex; flex-direction: column; gap: 8px; }
    #player-controls.chapters-collapsed #secondary { display: none; }
    #status { color: #b0cddb; font-size: 11px; line-height: 1.35; }
    #chapters { display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; width: 100%; padding: 2px 1px 4px; scrollbar-color: rgba(90,232,255,.35) transparent; scrollbar-width: thin; }
    .chapter { flex: 0 0 auto; padding: 5px 10px; border: 1px solid rgba(255,255,255,.15); border-radius: 16px; background: rgba(255,255,255,.05); color: #b0cddb; font-size: 11px; white-space: nowrap; cursor: pointer; }
    #page-note { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: #8ca6b8; font-size: 12px; line-height: 1.4; }
    .text-link { color: #73eaff; text-decoration: none; white-space: nowrap; }
    .text-link:hover { text-decoration: underline; }
    #audio { display: none; }
    @media (max-width: 680px) {
      body { padding: 8px; }
      #player-shell { width: min(100%, calc((100dvh - 196px) * 16 / 9)); gap: 8px; }
      #player-controls { gap: 7px; padding: 9px 9px 8px; }
      .control-row { gap: 6px; }
      .button { min-height: 32px; padding: 5px 9px; font-size: 12px; }
      #time { min-width: 84px; font-size: 11px; }
      #speed { min-width: 50px; }
      #chapter-toggle { min-width: 80px; }
      #page-note { font-size: 11px; }
      .chapter { padding-inline: 9px; }
    }
    @media (max-width: 390px) {
      #time { min-width: 76px; font-size: 10px; }
      .control-row { gap: 4px; }
      .button { padding-inline: 7px; }
      #chapter-toggle { min-width: 72px; }
      #page-note { align-items: flex-start; flex-direction: column; gap: 5px; }
    }
  </style>
</head>
<body>
  <main id="player-shell">
    <div id="stage-wrapper" aria-label="V5推理決策樹動畫畫面"><div id="canvas-container"></div></div>
    <section id="player-controls" aria-label="預覽播放控制">
      <div class="control-row">
        <button class="button" id="play" type="button" aria-label="播放">播放</button>
        <span id="time" aria-live="off">00:22 / 00:45</span>
        <input id="timeline" type="range" min="0" max="23.4" value="0" step="0.05" aria-label="播放位置" />
        <button class="button" id="speed" type="button" aria-label="播放速度">1.0×</button>
        <button class="button" id="chapter-toggle" type="button" aria-expanded="true" aria-controls="secondary">收起章節</button>
      </div>
      <div id="secondary">
        <div id="status" role="status">按「播放」開始旁白同步預覽；時間段為 00:22.2–00:45.6。</div>
        <nav id="chapters" aria-label="推理段落章節">
          <button class="chapter active" type="button" data-time="0">00:22 粒子重組／答案與推理</button>
          <button class="chapter" type="button" data-time="7.88">00:30 逐步依賴的決策</button>
          <button class="chapter" type="button" data-time="14.96">00:37 小錯誤污染結果</button>
          <button class="chapter" type="button" data-time="19.1">00:41 一次答對仍不足</button>
        </nav>
      </div>
    </section>
    <div id="page-note">
      <span>V5 任務 2／8 · 推理與錯誤傳播 · 原定至00:45；延至00:45.6以保留完整句尾</span>
      <span><a class="text-link" href="./v5-preview.html">任務1 開場預覽</a> · <a class="text-link" href="./">返回 V4 全片</a></span>
    </div>
    <audio id="audio" preload="metadata" src="./assets/audio/v5_task02_reasoning_22_2_45_6.mp3"></audio>
  </main>
  <script type="module" src="./src/v5_reasoning_preview.js"></script>
  <script type="module">
    const FPS = 24, PREVIEW_DURATION = 23.4, SOURCE_START = 22.2;
    const audio = document.getElementById('audio'), playButton = document.getElementById('play');
    const timeline = document.getElementById('timeline'), timeLabel = document.getElementById('time');
    const speedButton = document.getElementById('speed'), controls = document.getElementById('player-controls');
    const chapterToggle = document.getElementById('chapter-toggle'), status = document.getElementById('status');
    const chapters = [...document.querySelectorAll('.chapter')], speedValues = [0.5, 1.0, 1.5, 2.0];
    let speedIndex = 1, lastFrame = -1, syncRaf = 0;
    const clampTime = value => Math.max(0, Math.min(PREVIEW_DURATION, Number(value) || 0));
    function formatTime(seconds) { const n = Math.floor(Math.max(0, seconds)); return `${String(Math.floor(n / 60)).padStart(2, '0')}:${String(n % 60).padStart(2, '0')}`; }
    function draw(time, force = false) {
      const t = clampTime(time), frame = Math.max(0, Math.min(Math.round(PREVIEW_DURATION * FPS), Math.round(t * FPS)));
      window.__playerTime = t;
      if ((force || frame !== lastFrame) && window.renderFrame) { window.renderFrame(frame); lastFrame = frame; }
      if (document.activeElement !== timeline) timeline.value = String(t);
      timeLabel.textContent = `${formatTime(SOURCE_START + t)} / 00:45.6`;
      chapters.forEach(button => {
        const start = Number(button.dataset.time), next = chapters.find(item => Number(item.dataset.time) > start);
        const end = next ? Number(next.dataset.time) : PREVIEW_DURATION + 1;
        button.classList.toggle('active', t >= start && t < end);
      });
    }
    function setStatus(playing, message) { playButton.textContent = playing ? '暫停' : '播放'; playButton.setAttribute('aria-label', playing ? '暫停' : '播放'); status.textContent = message; }
    async function togglePlay() {
      if (audio.paused) {
        if (audio.ended || audio.currentTime >= PREVIEW_DURATION - 0.08) { audio.currentTime = 0; draw(0, true); }
        try { await audio.play(); } catch { setStatus(false, '瀏覽器未能播放音訊；請再按一次「播放」。'); }
      } else audio.pause();
    }
    function seek(time) { const t = clampTime(time); if (Number.isFinite(audio.duration)) audio.currentTime = Math.min(t, audio.duration); draw(t, true); }
    function syncLoop() { syncRaf = 0; if (audio.paused) return; draw(audio.currentTime); syncRaf = requestAnimationFrame(syncLoop); }
    function startSync() { if (!syncRaf) syncRaf = requestAnimationFrame(syncLoop); }
    function stopSync() { if (syncRaf) { cancelAnimationFrame(syncRaf); syncRaf = 0; } }
    playButton.addEventListener('click', togglePlay);
    timeline.addEventListener('input', event => seek(event.target.value));
    timeline.addEventListener('change', () => timeline.blur());
    speedButton.addEventListener('click', () => { speedIndex = (speedIndex + 1) % speedValues.length; const speed = speedValues[speedIndex]; speedButton.textContent = `${speed.toFixed(1)}×`; audio.playbackRate = speed; });
    chapters.forEach(button => button.addEventListener('click', () => seek(button.dataset.time)));
    chapterToggle.addEventListener('click', () => { const collapsed = controls.classList.toggle('chapters-collapsed'); chapterToggle.textContent = collapsed ? '展開章節' : '收起章節'; chapterToggle.setAttribute('aria-expanded', String(!collapsed)); });
    window.addEventListener('keydown', event => { const focused = document.activeElement?.tagName; if (event.code === 'Space' && !['BUTTON', 'INPUT', 'A'].includes(focused)) { event.preventDefault(); togglePlay(); } else if (event.key.toLowerCase() === 'h') chapterToggle.click(); });
    audio.addEventListener('loadedmetadata', () => { timeline.max = PREVIEW_DURATION; draw(audio.currentTime, true); status.textContent = '旁白與動畫已就緒；按「播放」開始同步預覽。'; });
    audio.addEventListener('play', () => { setStatus(true, '播放中 · 畫面以旁白音軌作主時鐘。'); startSync(); });
    audio.addEventListener('pause', () => { stopSync(); draw(audio.currentTime, true); if (!audio.ended) setStatus(false, '已暫停 · 拖曳時間軸或點章節可同步跳轉。'); });
    audio.addEventListener('seeked', () => draw(audio.currentTime, true));
    audio.addEventListener('timeupdate', () => draw(audio.currentTime));
    audio.addEventListener('waiting', () => status.textContent = '音訊載入中；畫面會停留在相同媒體時間。');
    audio.addEventListener('ended', () => { stopSync(); draw(PREVIEW_DURATION, true); setStatus(false, '預覽已結束 · 按「播放」可重新觀看。'); });
    window.addEventListener('v5scene-ready', () => draw(audio.currentTime, true));
    window.__previewDuration = PREVIEW_DURATION;
  </script>
</body>
</html>
