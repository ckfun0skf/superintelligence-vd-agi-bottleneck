<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <link rel="modulepreload" href="./assets/vendor/three.module.js" />
  <title>SUPER INTELLIGENT — V5 連續預覽</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: #010308; color: #eaffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    body { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; overflow-x: hidden; overflow-y: auto; padding: clamp(8px, 2vh, 20px) 12px; }
    #player-shell { width: min(100%, 1600px, calc((100dvh - 215px) * 16 / 9)); display: flex; flex-direction: column; gap: 10px; margin: auto; }
    #stage-wrapper { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #02050b; overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,.75); }
    #canvas-container { position: absolute; inset: 0; }
    #canvas-container canvas { display: block; width: 100% !important; height: 100% !important; }
    #player-controls { display: flex; flex-direction: column; gap: 9px; width: 100%; padding: 10px 14px 11px; border: 1px solid rgba(90,232,255,.28); border-radius: 10px; background: rgba(8,14,28,.96); box-shadow: 0 8px 32px rgba(0,0,0,.55); }
    .control-row { display: flex; align-items: center; gap: 10px; width: 100%; min-width: 0; }
    .button { flex: 0 0 auto; min-height: 34px; padding: 6px 12px; border: 1px solid rgba(90,232,255,.4); border-radius: 6px; background: rgba(90,232,255,.12); color: #eaffff; font-size: 13px; font-weight: 650; cursor: pointer; }
    .button:hover, .chapter:hover, .chapter.active { background: rgba(90,232,255,.23); border-color: #5ae8ff; color: white; }
    .button:focus-visible, .chapter:focus-visible, #timeline:focus-visible, .text-link:focus-visible { outline: 2px solid white; outline-offset: 2px; }
    #time { flex: 0 0 auto; min-width: 94px; text-align: center; color: #5ae8ff; font: 700 13px ui-monospace, SFMono-Regular, Consolas, monospace; font-variant-numeric: tabular-nums; }
    #timeline { flex: 1 1 auto; min-width: 45px; height: 6px; accent-color: #5ae8ff; cursor: pointer; }
    #speed { min-width: 58px; }
    #chapter-toggle { min-width: 96px; color: #bdeeff; background: rgba(255,255,255,.045); border-color: rgba(255,255,255,.2); }
    #secondary { display: flex; flex-direction: column; gap: 8px; }
    #player-controls.chapters-collapsed #secondary { display: none; }
    #status { color: #b0cddb; font-size: 11px; line-height: 1.35; }
    #chapters { display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; width: 100%; padding: 2px 1px 4px; scrollbar-color: rgba(90,232,255,.35) transparent; scrollbar-width: thin; }
    .chapter { flex: 0 0 auto; padding: 5px 10px; border: 1px solid rgba(255,255,255,.15); border-radius: 16px; background: rgba(255,255,255,.05); color: #b0cddb; font-size: 11px; white-space: nowrap; cursor: pointer; }
    #page-note { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: #8ca6b8; font-size: 12px; line-height: 1.4; }
    .text-link { color: #73eaff; text-decoration: none; white-space: nowrap; }
    .text-link:hover { text-decoration: underline; }
    #audio { display: none; }
    @media (max-width: 680px) {
      body { padding: 8px; }
      #player-shell { width: min(100%, calc((100dvh - 196px) * 16 / 9)); gap: 8px; }
      #player-controls { gap: 7px; padding: 9px 9px 8px; }
      .control-row { gap: 6px; }
      .button { min-height: 32px; padding: 5px 9px; font-size: 12px; }
      #time { min-width: 80px; font-size: 11px; }
      #speed { min-width: 50px; }
      #chapter-toggle { min-width: 80px; }
      #page-note { font-size: 11px; }
      .chapter { padding-inline: 9px; }
    }
    @media (max-width: 390px) {
      #time { min-width: 72px; font-size: 10px; }
      .control-row { gap: 4px; }
      .button { padding-inline: 7px; }
      #chapter-toggle { min-width: 72px; }
      #page-note { align-items: flex-start; flex-direction: column; gap: 5px; }
    }
  </style>
</head>
<body>
  <main id="player-shell">
    <div id="stage-wrapper" aria-label="V5連續動畫預覽畫面">
      <div id="canvas-container"></div>
    </div>
    <section id="player-controls" aria-label="預覽播放控制">
      <div class="control-row">
        <button class="button" id="play" type="button" aria-label="播放">播放</button>
        <span id="time" aria-live="off">00:00 / 01:22</span>
        <input id="timeline" type="range" min="0" max="82" value="0" step="0.05" aria-label="播放位置" />
        <button class="button" id="speed" type="button" aria-label="播放速度">1.0×</button>
        <button class="button" id="chapter-toggle" type="button" aria-expanded="true" aria-controls="secondary">收起章節</button>
      </div>
      <div id="secondary">
        <div id="status" role="status">按「播放」開始連續旁白同步預覽；目前涵蓋 00:00–01:22.00。</div>
        <nav id="chapters" aria-label="V5連續預覽章節">
          <button class="chapter active" type="button" data-time="0.0">00:00 速度建立</button>
          <button class="chapter" type="button" data-time="4.34">00:04 寫程式</button>
          <button class="chapter" type="button" data-time="6.03">00:06 解難</button>
          <button class="chapter" type="button" data-time="8.18">00:08 資訊流</button>
          <button class="chapter" type="button" data-time="10.62">00:10 新世代</button>
          <button class="chapter" type="button" data-time="14.62">約00:15 How far</button>
          <button class="chapter" type="button" data-time="17.02">00:17 Scaling</button>
          <button class="chapter" type="button" data-time="19.12">約00:19 AGI問句</button>
          <button class="chapter" type="button" data-time="22.20">00:22 推理不是答案</button>
          <button class="chapter" type="button" data-time="30.08">00:30 多步驟決策</button>
          <button class="chapter" type="button" data-time="37.16">00:37 錯誤傳播</button>
          <button class="chapter" type="button" data-time="41.30">00:41 可靠性</button>
          <button class="chapter" type="button" data-time="45.60">00:45 新問題測試</button>
          <button class="chapter" type="button" data-time="50.76">00:51 模式與成因</button>
          <button class="chapter" type="button" data-time="55.36">00:55 Text / Image / Video</button>
          <button class="chapter" type="button" data-time="60.86">01:01 模式不等於原因</button>
          <button class="chapter" type="button" data-time="67.96">01:08 陌生情境</button>
          <button class="chapter" type="button" data-time="71.96">01:12 預測結果</button>
          <button class="chapter" type="button" data-time="75.76">01:16 隱藏變數</button>
          <button class="chapter" type="button" data-time="77.56">01:18 更新理解</button>
          <button class="chapter" type="button" data-time="79.26">01:19 現實反駁預期</button>
        </nav>
      </div>
    </section>
    <div id="page-note">
      <span>V5 單頁連續預覽 · 已整合 00:00–01:22.00 · 目前含任務1至3</span>
      <span><a class="text-link" href="./">返回 V4 全片預覽</a></span>
    </div>
    <audio id="audio" preload="auto" src="./assets/audio/v5_continuous_preview_01_22_00.mp3"></audio>
  </main>
  <script type="module" src="./src/v5_continuous_preview.js"></script>
  <script type="module">
    const FPS = 24;
    const PREVIEW_DURATION = 82.0;
    const audio = document.getElementById('audio');
    const playButton = document.getElementById('play');
    const timeline = document.getElementById('timeline');
    const timeLabel = document.getElementById('time');
    const speedButton = document.getElementById('speed');
    const controls = document.getElementById('player-controls');
    const chapterToggle = document.getElementById('chapter-toggle');
    const status = document.getElementById('status');
    const chapters = [...document.querySelectorAll('.chapter')];
    const speedValues = [0.5, 1.0, 1.5, 2.0];
    let speedIndex = 1;
    let seeking = false;
    let lastFrame = -1;

    const clampTime = time => Math.max(0, Math.min(PREVIEW_DURATION, Number(time) || 0));
    function formatTime(time) {
      const safe = Math.floor(Math.max(0, time));
      return `${String(Math.floor(safe / 60)).padStart(2, '0')}:${String(safe % 60).padStart(2, '0')}`;
    }
    function draw(time, force = false) {
      const safeTime = clampTime(time);
      const frame = Math.max(0, Math.min(Math.round(PREVIEW_DURATION * FPS), Math.round(safeTime * FPS)));
      window.__playerTime = safeTime;
      if (force || frame !== lastFrame) {
        if (window.renderFrame) window.renderFrame(frame);
        lastFrame = frame;
      }
      if (document.activeElement !== timeline) timeline.value = String(safeTime);
      timeLabel.textContent = `${formatTime(safeTime)} / ${formatTime(PREVIEW_DURATION)}`;
      chapters.forEach(button => {
        const t = Number(button.dataset.time);
        const next = chapters.find(x => Number(x.dataset.time) > t);
        const end = next ? Number(next.dataset.time) : PREVIEW_DURATION + 1;
        button.classList.toggle('active', safeTime >= t && safeTime < end);
      });
    }
    function setPlayState(playing, message) {
      playButton.textContent = playing ? '暫停' : '播放';
      playButton.setAttribute('aria-label', playing ? '暫停' : '播放');
      status.textContent = message;
    }
    async function togglePlay() {
      if (audio.paused) {
        if (audio.ended || audio.currentTime >= PREVIEW_DURATION - 0.08) {
          audio.currentTime = 0;
          draw(0, true);
        }
        try { await audio.play(); }
        catch { setPlayState(false, '瀏覽器未能播放音訊；請再按一次「播放」。'); }
      } else {
        audio.pause();
      }
    }
    function seek(time) {
      const t = clampTime(time);
      if (Number.isFinite(audio.duration)) audio.currentTime = Math.min(t, audio.duration);
      draw(t, true);
    }
    playButton.addEventListener('click', togglePlay);
    timeline.addEventListener('input', event => seek(event.target.value));
    timeline.addEventListener('change', () => timeline.blur());
    speedButton.addEventListener('click', () => {
      speedIndex = (speedIndex + 1) % speedValues.length;
      const speed = speedValues[speedIndex];
      speedButton.textContent = `${speed.toFixed(1)}×`;
      audio.playbackRate = speed;
    });
    chapters.forEach(button => button.addEventListener('click', () => seek(button.dataset.time)));
    chapterToggle.addEventListener('click', () => {
      const collapsed = controls.classList.toggle('chapters-collapsed');
      chapterToggle.textContent = collapsed ? '展開章節' : '收起章節';
      chapterToggle.setAttribute('aria-expanded', String(!collapsed));
    });
    window.addEventListener('keydown', event => {
      const focused = document.activeElement?.tagName;
      if (event.code === 'Space' && !['BUTTON', 'INPUT', 'A'].includes(focused)) {
        event.preventDefault();
        togglePlay();
      } else if (event.key.toLowerCase() === 'h') {
        chapterToggle.click();
      }
    });
    audio.addEventListener('loadedmetadata', () => {
      timeline.max = PREVIEW_DURATION;
      draw(audio.currentTime, true);
      status.textContent = '連續旁白音軌已就緒；按「播放」開始同步預覽。';
    });
    audio.addEventListener('play', () => setPlayState(true, '播放中 · 畫面以旁白音軌作主時鐘。'));
    audio.addEventListener('pause', () => {
      if (!audio.ended) setPlayState(false, '已暫停 · 拖曳時間軸或點章節可同步跳轉。');
    });
    audio.addEventListener('seeked', () => draw(audio.currentTime, true));
    audio.addEventListener('timeupdate', () => {
      if (!seeking) draw(audio.currentTime);
    });
    audio.addEventListener('waiting', () => status.textContent = '音訊載入中；畫面會停留在相同媒體時間。');
    audio.addEventListener('ended', () => {
      draw(PREVIEW_DURATION, true);
      setPlayState(false, '目前完成的V5預覽已播放完；按「播放」可重播。');
    });
    audio.addEventListener('error', () => setPlayState(false, '預覽音訊載入失敗，請稍後重試。'));

    function animationLoop() {
      if (!audio.paused && !audio.seeking) draw(audio.currentTime);
      requestAnimationFrame(animationLoop);
    }
    draw(0, true);
    animationLoop();
    if (audio.readyState >= 1) audio.dispatchEvent(new Event('loadedmetadata'));
  </script>
</body>
</html>
